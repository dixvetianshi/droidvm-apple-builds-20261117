name: DroidVM Windows 11 ARM64

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows11-arm64-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select an owned Windows scratch directory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_RUN_ID -notmatch '^\d+$') { throw 'Missing Actions run identity' }
          $volumes = @(Get-Volume | Where-Object { $_.DriveLetter -in @('C','D') } | Sort-Object SizeRemaining -Descending)
          if (-not $volumes.Count) { throw 'No fixed runner data volume is available' }
          $selected = $volumes[0]
          Write-Host "Selected runner volume $($selected.DriveLetter), free bytes $($selected.SizeRemaining)"
          $parent = "$($selected.DriveLetter):\DroidVM-Windows-CI-$($env:GITHUB_RUN_ID)"
          if (Test-Path -LiteralPath $parent) { throw 'Preserve any pre-existing scratch parent' }
          New-Item -ItemType Directory -Path $parent | Out-Null
          "WINDOWS_TEMP_PARENT=$parent" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Assemble the official ARM64 Windows image offline
        shell: pwsh
        env:
          WINDOWS_ISO_URL: ${{ secrets.WINDOWS_ISO_URL }}
          WINDOWS_QEMU_PACKAGE_VERSION: '2026.8.11'
        run: |
          & ./tools/build_windows_ci.ps1
      - name: Encrypt Windows source before upload
        shell: pwsh
        env:
          ARTIFACT_KEY: ${{ secrets.ARTIFACT_KEY }}
        run: |
          & ./tools/seal_windows_artifact.ps1
      - name: Upload only encrypted Windows source
        uses: actions/upload-artifact@v4
        with:
          name: windows11-arm64-encrypted-${{ github.run_number }}
          path: ${{ env.WINDOWS_RELEASE_DIR }}/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows11-arm64-encrypted-${{ github.run_number }}
          path: encrypted-windows-source
      - name: Publish encrypted downloads and checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="windows11-26h2-arm64-run-${GITHUB_RUN_NUMBER}"
          printf '%s\n' 'Windows 11 26H2 ARM64 Simplified Chinese offline disk build using the official Microsoft ISO and pinned DroidVM drivers. Only encrypted source parts and transport checksums are published. The local package requires matching crosvm/EDK2 and private NVRAM binding after a real import. Phone import and Windows startup remain unverified.' > "$RUNNER_TEMP/windows-release-notes.txt"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "Windows 11 ARM64 encrypted build ${GITHUB_RUN_NUMBER}" --notes-file "$RUNNER_TEMP/windows-release-notes.txt"
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" encrypted-windows-source/*
