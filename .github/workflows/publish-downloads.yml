name: Publish completed encrypted downloads

on:
  workflow_dispatch:
    inputs:
      target:
        description: Completed build to publish
        type: choice
        options: [all, macos, firmware, crosvm, ipados]
        default: all

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-apple-downloads
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  macos:
    if: inputs.target == 'all' || inputs.target == 'macos'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Fetch the completed encrypted macOS image
        uses: actions/download-artifact@v8
        with:
          name: image-27.2-1
          run-id: 44099443317
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/encrypted-image
      - name: Fetch its completed public build record
        uses: actions/download-artifact@v8
        with:
          name: image-27.2-1-plain
          run-id: 44099443317
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/image-record
      - name: Verify all encrypted parts and publish the download
        run: |
          cd "$RUNNER_TEMP/encrypted-image"
          sha256sum -c "$RUNNER_TEMP/image-record/image.tar.zst.enc.sha256"
          tag=macos-27.2-run-1
          if ! gh release view "$tag" >/dev/null 2>&1; then
            printf '%s\n' 'Completed macOS 27.2 build, source run 44099443317. The Apple-containing image remains AES-256-CBC/PBKDF2 encrypted. The key is kept by the owner; no key or account credentials are published. Verify image.tar.zst.enc.sha256 before local decryption. Device boot is not yet verified.' > "$RUNNER_TEMP/image-release-notes.txt"
            gh release create "$tag" --prerelease --title 'macOS 27.2 encrypted build 1' --notes-file "$RUNNER_TEMP/image-release-notes.txt"
          fi
          gh release upload "$tag" --clobber image.tar.zst.enc.[0-9][0-9][0-9] "$RUNNER_TEMP/image-record/"*
          df -h "$RUNNER_TEMP"

  firmware:
    if: inputs.target == 'all' || inputs.target == 'firmware'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Fetch the completed public firmware and runtime baseline
        uses: actions/download-artifact@v8
        with:
          name: droidvm-apple-runtime-1
          run-id: 44108235034
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/runtime
      - name: Verify the files and publish the download
        run: |
          cd "$RUNNER_TEMP/runtime"
          sha256sum -c SHA256SUMS
          tar -czf "$RUNNER_TEMP/droidvm-apple-firmware-1.tar.gz" .
          cd "$RUNNER_TEMP"
          sha256sum droidvm-apple-firmware-1.tar.gz > droidvm-apple-firmware-1.tar.gz.sha256
          tag=apple-firmware-run-1
          if ! gh release view "$tag" >/dev/null 2>&1; then
            printf '%s\n' 'Completed EDK2 builds, source run 44108235034. Includes edk2-macos.fd with Virtio GOP disabled and edk2-virtio-gpu.fd with it enabled, provenance and a verified public runtime baseline. The baseline crosvm lacks the audio/media MMIO options required by the full macOS image; use the separately built matching crosvm. Phone loading and guest boot remain unverified.' > "$RUNNER_TEMP/firmware-release-notes.txt"
            gh release create "$tag" --prerelease --title 'DroidVM Apple firmware build 1' --notes-file "$RUNNER_TEMP/firmware-release-notes.txt"
          fi
          gh release upload "$tag" --clobber droidvm-apple-firmware-1.tar.gz droidvm-apple-firmware-1.tar.gz.sha256

  crosvm:
    if: inputs.target == 'all' || inputs.target == 'crosvm'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Fetch the completed matching crosvm build
        uses: actions/download-artifact@v8
        with:
          name: droidvm-crosvm-apple-1
          run-id: 44109572779
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/crosvm
      - name: Verify the complete runtime and publish the download
        run: |
          cd "$RUNNER_TEMP/crosvm"
          sha256sum -c SHA256SUMS
          tar -czf "$RUNNER_TEMP/droidvm-crosvm-apple-1.tar.gz" .
          cd "$RUNNER_TEMP"
          sha256sum droidvm-crosvm-apple-1.tar.gz > droidvm-crosvm-apple-1.tar.gz.sha256
          tag=crosvm-apple-run-1
          if ! gh release view "$tag" >/dev/null 2>&1; then
            printf '%s\n' 'Completed matching crosvm build, source run 44109572779. Contains the Android AArch64 VMM, matching non-platform runtime libraries, retained full build and shim, source locks, checksums and static option checks for Apple guest devices. These are build and file checks; Android loading and phone guest boot have not been verified.' > "$RUNNER_TEMP/crosvm-release-notes.txt"
            gh release create "$tag" --prerelease --title 'DroidVM Apple crosvm build 1' --notes-file "$RUNNER_TEMP/crosvm-release-notes.txt"
          fi
          gh release upload "$tag" --clobber droidvm-crosvm-apple-1.tar.gz droidvm-crosvm-apple-1.tar.gz.sha256

  ipados:
    if: inputs.target == 'all' || inputs.target == 'ipados'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Require the pinned iPadOS build to have succeeded
        run: |
          result=$(gh api "repos/$GH_REPO/actions/runs/44153495016" --jq '[.status, (.conclusion // "unknown"), .head_sha] | join(":")')
          test "$result" = 'completed:success:b74de42417ff3e4f0576c6fef34e10c6336f03dd' || { echo '::error::The selected iPadOS build has not completed successfully at the reviewed workflow revision.'; exit 1; }
      - name: Fetch the completed encrypted iPadOS output
        uses: actions/download-artifact@v8
        with:
          name: ipados-27.0.1-4-encrypted
          run-id: 44153495016
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/ipados-encrypted
      - name: Verify every encrypted part and publish the download
        run: |
          cd "$RUNNER_TEMP/ipados-encrypted"
          sha256sum -c ipados-27.0.1.tar.gz.enc.sha256
          tag=ipados-27.0.1-run-4
          if ! gh release view "$tag" >/dev/null 2>&1; then
            printf '%s\n' 'Completed iPadOS 27.0.1 / 24A446 build, source run 44153495016. The Apple-containing release, Data generation and source-adjustment records remain AES-256-CBC/PBKDF2 encrypted. No build key or device configuration is published. Verify every numbered part against ipados-27.0.1.tar.gz.enc.sha256 before local decryption. Phone import, Android loading and Apple guest boot remain unverified.' > "$RUNNER_TEMP/ipados-release-notes.txt"
            gh release create "$tag" --prerelease --title 'iPadOS 27.0.1 encrypted build 4' --notes-file "$RUNNER_TEMP/ipados-release-notes.txt"
          fi
          gh release upload "$tag" --clobber ipados-27.0.1.tar.gz.enc.[0-9][0-9][0-9] ipados-27.0.1.tar.gz.enc.sha256
          df -h "$RUNNER_TEMP"
