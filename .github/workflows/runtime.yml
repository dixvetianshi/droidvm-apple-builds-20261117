name: DroidVM Apple runtime components

on:
  workflow_dispatch:
    inputs:
      component:
        description: Select the runtime or one reviewed kernel component
        type: choice
        default: runtime
        options:
          - runtime
          - hostshare-only
          - hostshare-lease
          - reserve-repair

permissions:
  contents: read

concurrency:
  group: apple-runtime-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    if: inputs.component == 'runtime'
    # A standard GitHub-hosted ARM64 runner for public repositories.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install the firmware build tools on this disposable runner
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils acpica-tools uuid-dev python3 curl git
      - name: Verify the public runtime and build both firmware variants
        run: |
          bash -n tools/build_runtime_ci.sh
          bash tools/build_runtime_ci.sh
      - name: Upload the runtime components and their provenance
        uses: actions/upload-artifact@v4
        with:
          name: droidvm-apple-runtime-${{ github.run_number }}
          path: output/runtime/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
  hostshare:
    if: inputs.component == 'hostshare-only'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile only the reviewed HostShare component
        run: python3 tools/build_hostshare_component_ci.py
      - name: Retain component, source identity and complete diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apple-hostshare-component-${{ github.run_id }}
          path: output/hostshare-component/
          if-no-files-found: error
          retention-days: 14
  hostshare-lease:
    if: inputs.component == 'hostshare-lease'
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify existing tools and build-command process cleanup
        run: |
          command -v python3 git cc make docker bash
          mkdir -p output
          python3 tools/test_build_command_lifecycle.py 2>&1 | tee output/hostshare-lease-lifecycle.log
      - name: Test and compile only the App HostShare lease component
        run: python3 tools/build_hostshare_lease_component_ci.py
      - name: Retain the component, exact source and complete test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apple-hostshare-lease-${{ github.run_id }}
          path: |
            output/hostshare-lease-component/
            output/hostshare-lease-lifecycle.log
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
  reserve:
    if: inputs.component == 'reserve-repair'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify build-command process ownership and timeout cleanup
        run: python3 tools/test_build_command_lifecycle.py
      - name: Compile the pinned reserve repair without installing it
        run: python3 tools/build_reserve_component_ci.py
      - name: Retain source identity, component and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apple-reserve-repair-${{ github.run_id }}
          path: output/reserve-component/
          if-no-files-found: error
          retention-days: 14
