name: DroidVM HostShare lease candidate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostshare-lease-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  hostshare-lease:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify existing tools and build-command process cleanup
        run: |
          command -v python3 git cc make docker bash
          uname -a
          cc --version
          mkdir -p output
          python3 tools/test_build_command_lifecycle.py 2>&1 | tee output/hostshare-lease-lifecycle.log
      - name: Replay both pinned patches, run every sanitizer harness and compile the single KO
        run: python3 tools/build_hostshare_lease_component_ci.py
      - name: Retain the component, full test logs and fixed source provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apple-hostshare-lease-${{ github.run_id }}
          path: |
            output/hostshare-lease-component/
            output/hostshare-lease-lifecycle.log
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
